name: Build

on:
  pull_request:
    paths:
      - '.github/workflows/build_release.yml'
      - '.nuke/build.schema.json'
      - 'global.json'
      - '*.props'
      - 'build/**'
      - 'build.sh'
      - 'ClassIsland.iOS/**'
      - 'ClassIsland.iOS.Native/**'
      - 'ClassIsland/**'
      - 'ClassIsland.Core/**'
      - 'ClassIsland.Shared/**'
      - 'ClassIsland.Shared.IPC/**'
      - 'ClassIsland.Platforms.Abstractions/**'
      - 'ClassIsland.Platforms.Abstractions.Tests/**'
      - 'ClassIsland.Filter.iOS.slnf'
      - 'ClassIsland.sln'
      - 'roslyn/IconsMappingGenerator/**'
      - 'tools/ci/verify-ios-build-config.ps1'
      - 'tools/ci/verify-ios-ipa.sh'
      - 'tools/ci/verify-cobertura-coverage.ps1'
      - 'vendors/EdgeTtsSharp/**'
      - 'vendors/PhainonDistributionCenter.Shared/**'
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签'
        required: true
        type: string
      primary_version:
        description: '主发布版本'
        required: true
        type: string
      is_test_mode:
        description: '是否处于测试发布模式'
        required: false
        type: boolean

env:
  PDC_CLIENT_VERSION: 1.0.1.0

jobs:
  build_ios_unsigned:
    name: Build unsigned iOS IPA
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/develop/v2/ios' ||
        github.ref == 'refs/heads/develop/v2/misha-alpha' ||
        startsWith(github.ref, 'refs/tags/ios-v')
      }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      IOS_PROJECT: ClassIsland.iOS/ClassIsland.iOS.csproj
      IOS_CONFIGURATION: Release
      IOS_RUNTIME_IDENTIFIER: ios-arm64
      APPLICATION_ID: cn.classisland.ios
      XCODE_PATH: /Applications/Xcode_26.5.app
      IPA_PATH: ${{ github.workspace }}/out/out_app_ios_arm64_selfContained_ipa.ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - name: Resolve iOS build metadata
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.primary_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            app_version="$DISPATCH_VERSION"
            developer_preview=false
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#ios-v}"
            developer_preview=false
          else
            app_version="0.0.${GITHUB_RUN_NUMBER}"
            developer_preview=true
          fi

          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::iOS ApplicationDisplayVersion must contain exactly three numeric components: $app_version"
            exit 1
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "developer_preview=$developer_preview" >> "$GITHUB_OUTPUT"

      - name: Verify iOS build configuration
        shell: pwsh
        run: ./tools/ci/verify-ios-build-config.ps1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project ClassIsland.iOS.Native/ClassIsland.iOS.Native.xcodeproj -list

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add GitHub Packages source
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget add source
          --username github-actions
          --password "$NUGET_AUTH_TOKEN"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/ClassIsland/index.json"

      - name: Restore iOS workload
        run: dotnet workload restore "$IOS_PROJECT"

      - name: Run platform abstraction tests
        run: >-
          dotnet test
          ClassIsland.Platforms.Abstractions.Tests/ClassIsland.Platforms.Abstractions.Tests.csproj
          -c Release
          --collect:"XPlat Code Coverage"
          --settings ClassIsland.Platforms.Abstractions.Tests/coverlet.runsettings
          --results-directory "$RUNNER_TEMP/ios-tests"

      - name: Upload platform abstraction coverage
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-iOS-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-tests/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 14 }}

      - name: Verify platform abstraction coverage
        shell: pwsh
        run: >-
          ./tools/ci/verify-cobertura-coverage.ps1
          -ResultsDirectory "${{ runner.temp }}/ios-tests"
          -MinimumLineRate 0.8

      - name: Build unsigned iOS IPA through NUKE
        env:
          osName: ios
          arch: arm64
          package: ipa
          buildType: selfContained
          buildName: app
          configuration: ${{ env.IOS_CONFIGURATION }}
          appVersion: ${{ steps.metadata.outputs.app_version }}
          buildNumber: ${{ github.run_number }}
          brandType: Production
          DeveloperPreview: ${{ steps.metadata.outputs.developer_preview }}
          enableCodeSigning: 'false'
        run: ./build.sh PublishApp

      - name: Remove inherited code signatures
        run: |
          normalize_directory="$(mktemp -d "$RUNNER_TEMP/classisland-normalize-ipa.XXXXXX")"
          trap 'rm -rf "$normalize_directory"' EXIT
          /usr/bin/ditto -x -k "$IPA_PATH" "$normalize_directory"

          shopt -s nullglob
          app_bundles=("$normalize_directory"/Payload/*.app)
          if [[ "${#app_bundles[@]}" -ne 1 ]]; then
            echo "::error::The IPA must contain exactly one app bundle"
            exit 1
          fi
          app_bundle="${app_bundles[0]}"

          while IFS= read -r -d '' bundle; do
            if /usr/bin/codesign --display "$bundle" >/dev/null 2>&1; then
              /usr/bin/codesign --remove-signature "$bundle"
            fi
          done < <(/usr/bin/find "$app_bundle" -depth -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.xpc' -o -name '*.bundle' \) -print0)

          while IFS= read -r -d '' binary; do
            if /usr/bin/file -b "$binary" | /usr/bin/grep -q '^Mach-O' &&
               /usr/bin/codesign --display "$binary" >/dev/null 2>&1; then
              /usr/bin/codesign --remove-signature "$binary"
            fi
          done < <(/usr/bin/find "$app_bundle" -type f -print0)

          while IFS= read -r -d '' signature_directory; do
            rm -rf "$signature_directory"
          done < <(/usr/bin/find "$app_bundle" -depth -type d -name '_CodeSignature' -print0)

          while IFS= read -r -d '' provisioning_profile; do
            rm -f "$provisioning_profile"
          done < <(/usr/bin/find "$app_bundle" -type f -name 'embedded.mobileprovision' -print0)

          /usr/bin/xattr -cr "$app_bundle"
          rm -f "$IPA_PATH"
          (
            cd "$normalize_directory"
            /usr/bin/ditto -c -k --keepParent Payload "$IPA_PATH"
          )

      - name: Verify unsigned IPA
        run: >-
          bash ./tools/ci/verify-ios-ipa.sh
          "$IPA_PATH"
          "$APPLICATION_ID"
          "$IOS_RUNTIME_IDENTIFIER"

      - name: Write iOS build summary
        run: |
          {
            echo "### ClassIsland unsigned iOS IPA"
            echo "- Version: \`${{ steps.metadata.outputs.app_version }}\`"
            echo "- Bundle ID: \`$APPLICATION_ID\`"
            echo "- Runtime: \`$IOS_RUNTIME_IDENTIFIER\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 "$IPA_PATH.sha256")\`"
            echo "- The IPA must be signed externally before installation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: out_app_ios_arm64_selfContained_ipa
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.IPA_PATH }}.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 14 }}

  build_app:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os == 'linux' &&  'ubuntu-24.04' || ( matrix.os == 'macos' && 'macos-26' || 'windows-2022' ) }}
    env:
      build_id: appBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_${{ matrix.package == 'folder' &&  'appBase' || 'app' }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'deb']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude: 
          - os: linux
            arch: x86
          - os: windows
            package: deb
          - os: linux
            build_type: full  # Linux 上安装 .NET 运行时很不方便，故使用自包含打包。
        include:
          - os: macos
            package: pkg
            build_type: selfContained
            arch: arm64
          - os: macos
            package: pkg
            build_type: selfContained
            arch: x64
    name: Build_AppBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}
      
      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      
      - name: Install Macos workload
        if: ${{ matrix.os == 'macos' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          dotnet workload install macos
        
      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassIsland --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"
        
      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName
      
      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          test_signing_key: ${{ secrets.TEST_SIGNING_KEY }}
          ApiSigningKey: ${{ secrets.API_SIGNING_KEY}}
          ApiSigningKeyPs: ${{ secrets.API_SIGNING_KEY_PS }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          appVersion: ${{ steps.tagName.outputs.tag }} 
          buildName: ${{ matrix.package == 'folder' &&  'appBase' || 'app' }}  # 打包版本的构建将在这一步直接产生完整的包体，无需经过分装
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishApp' || './build.sh PublishApp' }}
      
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            ./out/*.appx
            ./out/*.deb
            ./out/*.pkg
            
  build_launcher:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    env:
      build_id: launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['aot']
        package: ['singleFile']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
    name: Build_Launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    container: ${{ matrix.os == 'linux' && 'ghcr.io/classisland/philia-build-image:main' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}

      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            10.0.x

      - name: Setup philia Environment
        if: ${{ matrix.os == 'linux' }}
        run: |
          select-objcopy ${{ matrix.arch }}
          git config --global --add safe.directory '*'

      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: launcher
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishLauncher' || './build.sh PublishLauncher' }} 
          
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            
  sign_1:
    name: Sign_1
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' }}
    needs: [ build_app, build_launcher ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}
          
      - name: Get commit hash
        uses: prompt/actions-commit-hash@v3
        id: commit
        with:
          prefix: "${{ github.event.inputs.release_tag }}+"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Create Sign Bundle
        run: |
          pwsh -ep Bypass -c ./tools/release-gen/create-sign-bundle.ps1

      - name: Upload Sign Bundle to artifacts
        id: upload-sign-bundle
        uses: actions/upload-artifact@v4
        with:
          name: sign-bundle
          path: ./ci_tmp/sign_bundle/*
        
      - name: Sign Application
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_TOKEN }}'
          organization-id: '74962648-db7a-4a10-bfdd-0637542e39df'
          project-slug: 'ClassIsland'
          artifact-configuration-slug: 'sign_bundle_v2'
          signing-policy-slug: release-signing
          github-artifact-id: '${{ steps.upload-sign-bundle.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './out_signed'
          parameters: |
            version: ${{ toJSON(steps.commit.outputs.long) }}
            
      - name: Upload Signed Files to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed_artifacts
          path: ./out_signed/*
            
  pack_app:
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-latest' }}
    needs: [ sign_1 ]
    if: ${{ always() && success('build_app') && success('build_launcher') }}
    env:
      build_id: app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'installer']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
          - os: linux
            package: installer
          - build_type: full
            package: installer
          - os: linux
            build_type: full  # Linux 上安装 .NET 运行时很不方便，故使用自包含打包。
    name: Pack_App_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine Artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package
        env:
          package: ${{ matrix.package }}
          isRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildType: ${{ matrix.build_type }}
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile .iss to .exe Installer
        if: ${{ matrix.os == 'windows' && matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ github.event.inputs.release_tag || '2.0.0.0' }}
            /FClassIsland_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_installer.exe
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}
      

      - name: Upload Packages and Installer to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe
          
  build_nupkg:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2022
    env:
      Solution_Name: ClassIsland.sln
      Wap_Project_Directory: ClassIsland/ClassIsland
      Wap_Project_Path: ClassIsland/ClassIsland/ClassIsland.csproj
    name: Build Nuget Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }} 

      - name: List files
        run: ls

      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.0.2
        
      - name: Build Nuget packages
        env:
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ls
          ./build.ps1 BuildNupkg --isRelease $env:is_release
      
      - name: Upload Nuget packages to GitHub registry
        if: ${{ github.event_name != 'pull_request' }} 
        env:
          GHPKG_KEY: ${{ secrets.GITHUB_TOKEN }}
          MYGET_ORG_KEY: ${{ secrets.MYGET_ORG_KEY }}
        run: |
          dotnet nuget add source --username github-actions --password $env:GHPKG_KEY --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"
          dotnet nuget push .\out\package\release\*.nupkg -k $env:GHPKG_KEY --source "github" --skip-duplicate
          dotnet nuget push .\out\package\release\*.nupkg -k $env:MYGET_ORG_KEY --source https://www.myget.org/F/classisland/api/v3/index.json --skip-duplicate

      - name: Upload Nuget Packages to artifacts
        if: ${{ !matrix.trim_assets }}
        uses: actions/upload-artifact@v4
        with:
          name: out_nupkgs
          path: ./out/package/release/*.nupkg

  publish:
    runs-on: ubuntu-latest
    env:
      isTestMode: ${{ github.event.inputs.is_test_mode == 'true' }}
    if: >-
      ${{
        always() &&
        needs.pack_app.result == 'success' &&
        needs.build_nupkg.result == 'success' &&
        needs.build_ios_unsigned.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.release_tag != ''
      }}
    needs: [ pack_app, build_nupkg, build_ios_unsigned ]
    concurrency:
      group: "publish-public"
    environment:
      name: ${{ github.event.inputs.is_test_mode == 'true' && 'staging' || 'public' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }} 
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Verify downloaded iOS release artifact
        run: |
          artifact_directory="./out_artifacts/out_app_ios_arm64_selfContained_ipa"
          ipa_name="out_app_ios_arm64_selfContained_ipa.ipa"
          test -f "$artifact_directory/$ipa_name"
          test -f "$artifact_directory/$ipa_name.sha256"
          (
            cd "$artifact_directory"
            sha256sum --check "$ipa_name.sha256"
          )

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.METADATA_DEPLOY_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Publish App
        shell: pwsh
        env:
          S3_Bucket: ${{ vars.S3_BUCKET }}
          S3_Endpoint: ${{ vars.S3_ENDPOINT }}
          S3_Region: ${{ vars.S3_REGION }}
          PDC_Endpoint: ${{ vars.PDC_ENDPOINT }}
          PDC_SigningKey: ${{ secrets.PDC_SigningKey }}
          PDC_SigningKeyPs: ""
          PDC_Token: ${{ secrets.PDC_TOKEN }}
          S3_AccessKey: ${{ secrets.S3_ACCESSKEY }}
          S3_SecretKey: ${{ secrets.S3_SECRETKEY }}
          PDCC_version: ${{ github.event.inputs.release_tag }}
          PDCC_primaryVersion: ${{ github.event.inputs.primary_version }}
        run: |
          ./tools/release-gen/init-artifacts.ps1
          ./tools/release-gen/install-pdcc.ps1 linux
          ./pdcc/PhainonDistributionCenter.Client ./phainon.yml Publish ${{ github.event.inputs.primary_version }} ${{ github.event.inputs.release_tag }} ./out
          
      - name: Upload APP to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*.zip,./out/*.appx,./out/*.deb,./out/*.pkg,./out/*.ipa,./out/*.sha256"
          draft: true
          bodyFile: ./out/ChangeLogs.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }} 
          
      - name: Upload Nuget packages to NuGet Gallery
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' }}
        shell: pwsh
        env:
          NUGET_KEY: ${{ secrets.NUGET_ORG_KEY }}
        run: |
          ls
          cd out_artifacts/out_nupkgs
          dotnet nuget push *.nupkg -k $env:NUGET_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
